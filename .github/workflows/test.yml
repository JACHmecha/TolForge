name: Test desktop baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test-headless:
    name: Headless (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install desktop dependencies
        run: python -m pip install -r requirements.txt .
      - name: Check dependency consistency
        run: python -m pip check
      - name: Test scalar and headless desktop behavior
        run: python -m pytest tests -q -m "not native_cad" --strict-markers --junitxml=ci-evidence/headless-tests.xml
      - name: Check source imports, calculation and bundled icons
        run: python Code/gui/app.py --self-check-json ci-evidence/source-smoke.json
      - name: Describe coverage
        if: always()
        shell: pwsh
        run: |
          "Python ${{ matrix.python-version }}: scalar/domain and offscreen Qt tests; native_cad cases explicitly deselected. This job does not qualify STEP/OpenCASCADE, a native viewport, or a frozen executable." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Preserve headless evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-python-${{ matrix.python-version }}
          path: ci-evidence/
          if-no-files-found: warn
