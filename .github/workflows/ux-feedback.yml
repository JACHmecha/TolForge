name: UX feedback pilot

on:
  pull_request:
    paths:
      - 'Code/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - '.github/workflows/ux-feedback.yml'
  push:
    branches: [main]
    paths:
      - 'Code/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - '.github/workflows/ux-feedback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ux-feedback:
    name: Scalar workflow and evidence
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install desktop dependencies
        run: python -m pip install -r requirements.txt .
      - name: Run UX feedback pilot
        run: python scripts/run_ux_feedback.py --output-dir ux-evidence
      - name: Publish feedback summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'ux-evidence') {
            $summaries = @(Get-ChildItem -LiteralPath 'ux-evidence' -Filter 'summary.md' -Recurse -File | Sort-Object FullName)
          } else {
            $summaries = @()
          }
          if ($summaries.Count -eq 0) {
            'No UX report was generated. Inspect the installation and runner logs; this run provides no passing product evidence.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            foreach ($summary in $summaries) {
              Get-Content -LiteralPath $summary.FullName | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              '' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
      - name: Preserve UX feedback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-feedback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ux-evidence/
          retention-days: 14
          if-no-files-found: warn
