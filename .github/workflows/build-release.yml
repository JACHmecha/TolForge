name: Build release executable

permissions:
  contents: read

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  test-windows:
    uses: ./.github/workflows/test.yml

  build-windows:
    needs: test-windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and verify packaged executable
        shell: pwsh
        run: ./build_installer.ps1

      - name: Preserve executable and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: TolForge-windows
          path: |
            dist/TolForge.exe
            dist/packaged-smoke.json
            dist/pip-freeze.txt
            dist/SHA256.txt
            dist/source-provenance.json
          if-no-files-found: error

      - name: Upload verified executable to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$env:RELEASE_TAG" dist/TolForge.exe dist/packaged-smoke.json dist/pip-freeze.txt dist/SHA256.txt dist/source-provenance.json --clobber
