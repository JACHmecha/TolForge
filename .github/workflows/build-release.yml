name: Build release executable

permissions:
  contents: write

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install desktop dependencies
        run: python -m pip install -r requirements.txt .
      - name: Test supported Python baseline
        run: python -m pytest -q

  build-windows:
    needs: test-windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and verify packaged executable
        shell: pwsh
        run: ./build_installer.ps1

      - name: Preserve executable and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: TolForge-windows
          path: |
            dist/TolForge.exe
            dist/packaged-smoke.json
            dist/pip-freeze.txt
            dist/SHA256.txt
          if-no-files-found: error

      - name: Upload verified executable to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$env:RELEASE_TAG" dist/TolForge.exe dist/packaged-smoke.json dist/pip-freeze.txt dist/SHA256.txt --clobber
